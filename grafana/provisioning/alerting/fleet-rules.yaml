# Generated by `python -m fleet_as_code generate` - do not edit by hand.
apiVersion: 1
groups:
- orgId: 1
  name: fleet-health
  folder: Fleet alerts
  interval: 10s
  rules:
  - uid: wind-underperformance
    title: Wind turbine underperformance
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 240
        to: 0
      datasourceUid: influxdb-fleet
      model:
        refId: A
        query: |-
          from(bucket: "fleet")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "wind_turbine" and (r._field == "power_kw" or r._field == "expected_kw" or r._field == "state" or r._field == "available"))
            |> pivot(rowKey: ["_time"], columnKey: ["_field"], valueColumn: "_value")
            |> filter(fn: (r) => exists r.power_kw and exists r.expected_kw and exists r.state and exists r.available)
            |> filter(fn: (r) => r.state == 0 and r.available >= 1.0 and r.expected_kw > 500.0)
            |> reduce(identity: {actual: 0.0, expected: 0.0, n: 0}, fn: (r, accumulator) => ({actual: accumulator.actual + r.power_kw, expected: accumulator.expected + r.expected_kw, n: accumulator.n + 1}))
            |> filter(fn: (r) => r.n >= 12 and r.expected > 0.0)
            |> map(fn: (r) => ({r with _value: r.actual / r.expected}))
            |> map(fn: (r) => ({r with _time: r._stop}))
            |> keep(columns: ["_time", "_value", "site", "asset"])
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.85
    noDataState: OK
    execErrState: Error
    for: 30s
    annotations:
      summary: '{{ $labels.asset }} delivers {{ if $values.B }}{{ humanizePercentage $values.B.Value }}{{ end }} of its reference
        power'
      description: 'Actual / expected energy over the last 4 h of plant time against the turbine''s own reference curve: fully
        available producing intervals expecting more than 500 kW, at least 2 h of them. Below 85 % points at derating, pitch
        or yaw misalignment, icing or a sensor fault.'
      __dashboardUid__: wind-turbine
      __panelId__: '5'
    labels:
      severity: warning
      fleet: demo
    isPaused: false
  - uid: pv-underperformance
    title: PV underperformance
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: influxdb-fleet
      model:
        refId: A
        query: |-
          from(bucket: "fleet")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "pv_inverter" and (r._field == "ac_kw" or r._field == "poa_wm2"))
            |> pivot(rowKey: ["_time"], columnKey: ["_field"], valueColumn: "_value")
            |> filter(fn: (r) => exists r.ac_kw and exists r.poa_wm2 and r.poa_wm2 > 300.0)
            |> reduce(identity: {e: 0.0, h: 0.0, n: 0}, fn: (r, accumulator) => ({e: accumulator.e + r.ac_kw, h: accumulator.h + r.poa_wm2 / 1000.0 * 146.64, n: accumulator.n + 1}))
            |> filter(fn: (r) => r.n >= 4 and r.h > 0.0)
            |> map(fn: (r) => ({r with _value: r.e / r.h}))
            |> map(fn: (r) => ({r with _time: r._stop}))
            |> keep(columns: ["_time", "_value", "site", "asset"])
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.35
    noDataState: OK
    execErrState: Error
    for: 30s
    annotations:
      summary: '{{ $labels.asset }} performance ratio {{ if $values.B }}{{ humanizePercentage $values.B.Value }}{{ end }}'
      description: Performance ratio over the last 2 h of plant time with POA above 300 W/m2 (at least 1 h of such records).
        The site normally runs at 0.55-0.6; below 0.35 the inverter is off or heavily limited even if it reports no error.
      __dashboardUid__: pv-plant
      __panelId__: '5'
    labels:
      severity: critical
      fleet: demo
    isPaused: false
  - uid: no-data
    title: Asset data missing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 360
        to: 0
      datasourceUid: influxdb-fleet
      model:
        refId: A
        query: |-
          from(bucket: "fleet")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => (r._measurement == "wind_turbine" and r._field == "power_kw") or (r._measurement == "pv_inverter" and r._field == "ac_kw"))
            |> last()
            |> map(fn: (r) => ({r with _value: float(v: int(v: now()) - int(v: r._time)) / 1000000000.0 * 60.0 / 60.0}))
            |> keep(columns: ["_time", "_value", "site", "asset"])
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 30.0
    noDataState: Alerting
    execErrState: Error
    for: 0s
    annotations:
      summary: No data from {{ $labels.asset }} for {{ if $values.B }}{{ humanize $values.B.Value }}{{ end }} min of plant
        time
      description: Minutes of plant time since the last power record. Fires when an asset is silent for more than 30 min (3
        wind / 2 PV records); when the whole replay stops the rule goes to NoData and alerts too.
      __dashboardUid__: fleet-overview
      __panelId__: '7'
    labels:
      severity: critical
      fleet: demo
    isPaused: false
  - uid: availability-drop
    title: Availability drop
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 1440
        to: 0
      datasourceUid: influxdb-fleet
      model:
        refId: A
        query: |-
          from(bucket: "fleet")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => (r._measurement == "wind_turbine" or r._measurement == "pv_inverter") and r._field == "available")
            |> mean()
            |> map(fn: (r) => ({r with _time: r._stop}))
            |> keep(columns: ["_time", "_value", "site", "asset"])
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.9
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: '{{ $labels.asset }} availability {{ if $values.B }}{{ humanizePercentage $values.B.Value }}{{ end }} over
        the last 24 h'
      description: 'Time-based availability over the last 24 h of plant time below 90 %: a long stop in an unavailable category
        (forced outage, maintenance) or, for PV, no production in daylight.'
      __dashboardUid__: fleet-overview
      __panelId__: '10'
    labels:
      severity: warning
      fleet: demo
    isPaused: false
